<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Robaty">
    <title>Robaty - سفيرة التراث المغربي</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="app-header">
        <div class="header-top">
            <button class="icon-btn" id="apiKeyBtn" title="API Key">🔑</button>
            <div class="brand">
                <span class="gold-crown">👑</span>
                <h1>ROBATY</h1>
            </div>
            <button class="icon-btn" id="installBtn" title="تثبيت" style="display:none;">📲</button>
            <button class="icon-btn" id="clearMemoryBtn" onclick="clearMemory()" title="مسح الذاكرة">🗑️</button>
        </div>
        <div class="subtitle">سفيرة التراث والذكاء الاصطناعي 🇲🇦</div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="app-nav">
        <button class="nav-btn active" id="tab-moments-btn" onclick="switchTab('moments')">
            <span class="nav-icon">📷</span>
            <span>Moments</span>
        </button>
        <button class="nav-btn" id="tab-chat-btn" onclick="switchTab('chat')">
            <span class="nav-icon">💬</span>
            <span>المحادثة</span>
        </button>
    </nav>

    <!-- Main Content Container -->
    <main class="app-container">

        <!-- TAB 1: MOMENTS FEED -->
        <section id="section-moments" class="tab-content active">

            <!-- User Mood Tracker Slider -->
            <div class="glass-card mood-card">
                <div class="mood-header">
                    <span class="mood-title">كيف داير إحساسك اليوم؟</span>
                    <span id="mood-value-display" class="gold-badge">7 / 10</span>
                </div>
                <input type="range" min="1" max="10" value="7" class="gold-slider" id="user-mood-slider">
                <div class="mood-labels">
                    <span>😔 1 (تعبانة)</span>
                    <span>✨ 5</span>
                    <span>👑 10 (طاقة)</span>
                </div>
            </div>

            <!-- Daily Moment Post -->
            <article class="glass-card moment-card">
                <div class="moment-meta">
                    <span class="location-tag" id="moment-location">📍 ...</span>
                </div>

                <div class="moment-image-wrapper">
                    <img src="" alt="Robaty Moment" class="moment-img" id="daily-moment-img" onerror="this.src='https://images.unsplash.com/photo-1539020140153-e479b8c22e70?q=80&w=800&auto=format&fit=crop'">
                </div>

                <div class="moment-body">
                    <div class="challenge-box">
                        <span class="challenge-icon">🏆</span>
                        <div>
                            <strong>تحدي اليوم:</strong>
                            <p id="moment-challenge-text">...</p>
                        </div>
                    </div>
                </div>

                <!-- Interaction Buttons -->
                <div class="moment-actions">
                    <button class="action-btn" id="like-btn" onclick="toggleLike()">
                        <span id="like-icon">❤️</span> <span id="like-count">128</span>
                    </button>
                    <button class="action-btn" onclick="toggleCommentBox()">
                        <span>💬</span> تعليق (<span id="comment-count">0</span>)
                    </button>
                    <button class="action-btn" onclick="shareMoment()">
                        <span>📤</span> مشاركة
                    </button>
                </div>

                <!-- Comments Box -->
                <div class="comment-section" id="comment-box" style="display:none;">
                    <div class="comments-list" id="comments-list"></div>
                    <div class="comment-input-row">
                        <input type="text" id="comment-input" placeholder="اكتبي تعليقك..." autocomplete="off">
                        <button onclick="addComment()" class="send-btn">إرسال</button>
                    </div>
                </div>
            </article>

        </section>

        <!-- TAB 2: CHAT WITH ROBATY -->
        <section id="section-chat" class="tab-content">
            <div class="chat-wrapper glass-card">
                <div class="chat-header">
                    <div class="avatar-small">
                        <span class="status-dot"></span>
                        <span class="avatar-icon">🤖</span>
                    </div>
                    <div class="chat-title-info">
                        <h3>Robaty ✨</h3>
                        <p>متصلة الآن | سفيرة التراث</p>
                    </div>
                </div>

                <!-- Messages Stream -->
                <div id="chat-messages" class="chat-messages-container">
                    <div class="message-bubble robaty-msg">
                        صباح الخير والأنوار! 🤍 كيف دايرة اليوم؟ راني هنا نسمع ليك ونرافقك فنهارك.
                    </div>
                </div>

                <!-- Input Box -->
                <div class="chat-input-wrapper">
                    <input type="text" id="chat-input" placeholder="اكتبي رسالتك لـ Robaty هنا..." autocomplete="off">
                    <button id="send-btn" class="send-btn">
                        <span>إرسال</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- API Key Modal -->
    <div class="modal-overlay" id="apiKeyModal">
        <div class="modal-box glass-card">
            <div class="modal-title">🔑 API Key</div>
            <input type="password" id="apiKeyInput" placeholder="الصق مفتاحك هنا" class="api-key-input">
            <button onclick="saveKey()" class="send-btn" style="width:100%; padding:12px;">حفظ والبدء</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
